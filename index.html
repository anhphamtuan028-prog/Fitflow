<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitFlow 3D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090d16" />
  <title>FitFlow Pro - Anatomical 3D Mannequin</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090d16'/><text y='68' x='50' text-anchor='middle' font-size='55'>🧍</text></svg>" />

  <!-- Three.js Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Tailwind CSS & React UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: none;
    }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    canvas { touch-action: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ÂM THANH BÍP BÁO NHỊP
    const playBeep = (freq = 880, duration = 160) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch (e) {}
    };

    // BỘ RENDER 3D ANATOMICAL MANNEQUIN CÓ KHUNG XƯƠNG PHÂN CẤP (HIERARCHICAL RIG)
    const AnatomicalMannequin3D = ({ exerciseMode = "squat", cameraAngle = "front" }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const width = container.clientWidth || 340;
        const h = 260;

        // Scene & Studio Lighting
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // Nền studio slate tối hiện đại

        const camera = new THREE.PerspectiveCamera(40, width / h, 0.1, 40);
        camera.position.set(0, 0.2, 3.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Ánh sáng Studio dịu nhẹ (Soft Studio Light)
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
        keyLight.position.set(2.5, 4, 3);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
        fillLight.position.set(-2.5, 2, 2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xf59e0b, 0.4);
        rimLight.position.set(0, -3, -3);
        scene.add(rimLight);

        // Lưới sàn Studio tối giản
        const grid = new THREE.GridHelper(5, 10, 0x334155, 0x1e293b);
        grid.position.y = -1.15;
        scene.add(grid);

        // HỆ CHẤT LIỆU MÀU THEO CHUẨN GIẢI PHẪU FITNESS
        // 1. Inactive: Xám sáng mờ
        const matInactive = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
        // 2. Primary Muscle: Đỏ tươi (Vivid Red)
        const matPrimary = new THREE.MeshLambertMaterial({ color: 0xef4444 });
        // 3. Secondary Muscle: Cam ấm (Warm Orange)
        const matSecondary = new THREE.MeshLambertMaterial({ color: 0xf97316 });
        // 4. Khớp xương: Xám than chì
        const matJoint = new THREE.MeshLambertMaterial({ color: 0x475569 });

        // Gán màu theo bài tập để người tập thấy rõ nhóm cơ hoạt động
        const isSquat = exerciseMode === "squat";
        const isPushup = exerciseMode === "pushup";

        const matChest = isPushup ? matPrimary : matInactive;
        const matArm = isPushup ? matPrimary : matInactive;
        const matCore = (isPushup || isSquat) ? matSecondary : matInactive;
        const matThigh = isSquat ? matPrimary : matInactive;
        const matGlute = isSquat ? matSecondary : matInactive;
        const matCalf = isSquat ? matSecondary : matInactive;

        // TÂM XOAY TOÀN CƠ THỂ
        const pivotRoot = new THREE.Group();
        pivotRoot.position.set(0, 0, 0);
        scene.add(pivotRoot);

        // Nút xoay mặt trước / mặt sau
        if (cameraAngle === "back") {
          pivotRoot.rotation.y = Math.PI;
        }

        // ================= CẤU TRÚC KHUNG XƯƠNG PHÂN CẤP (HIERARCHY) =================
        // Hông / Khung chậu (Pelvis) làm gốc
        const pelvisGroup = new THREE.Group();
        pelvisGroup.position.set(0, -0.05, 0);
        pivotRoot.add(pelvisGroup);

        const pelvisMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.22, 10), matGlute);
        pelvisGroup.add(pelvisMesh);

        // Cột sống / Bụng (Spine / Core)
        const spineGroup = new THREE.Group();
        spineGroup.position.set(0, 0.18, 0);
        pelvisGroup.add(spineGroup);

        const absMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.17, 0.24, 10), matCore);
        spineGroup.add(absMesh);

        // Lồng ngực / Ngực (Chest / Torso)
        const chestGroup = new THREE.Group();
        chestGroup.position.set(0, 0.22, 0);
        spineGroup.add(chestGroup);

        const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.28, 0.22), matChest);
        chestGroup.add(chestMesh);

        // Cổ & Đầu (Neck & Head)
        const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.1, 8), matInactive);
        neckMesh.position.set(0, 0.19, 0);
        chestGroup.add(neckMesh);

        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 14), matInactive);
        headMesh.scale.set(0.95, 1.15, 1.0);
        headMesh.position.set(0, 0.35, 0);
        chestGroup.add(headMesh);

        // --- TAY PHẢI (Right Arm Hierarchy) ---
        const rClavicle = new THREE.Group();
        rClavicle.position.set(0.26, 0.1, 0);
        chestGroup.add(rClavicle);
        const rShoulderJoint = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), matJoint);
        rClavicle.add(rShoulderJoint);

        const rUpperArmGroup = new THREE.Group();
        rClavicle.add(rUpperArmGroup);
        const rBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.35, 8), matArm);
        rBicep.position.set(0, -0.18, 0);
        rUpperArmGroup.add(rBicep);

        const rElbowGroup = new THREE.Group();
        rElbowGroup.position.set(0, -0.36, 0);
        rUpperArmGroup.add(rElbowGroup);
        const rElbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), matJoint);
        rElbowGroup.add(rElbowJoint);

        const rForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.34, 8), matArm);
        rForearm.position.set(0, -0.18, 0);
        rElbowGroup.add(rForearm);

        // --- TAY TRÁI (Left Arm Hierarchy) ---
        const lClavicle = new THREE.Group();
        lClavicle.position.set(-0.26, 0.1, 0);
        chestGroup.add(lClavicle);
        const lShoulderJoint = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), matJoint);
        lClavicle.add(lShoulderJoint);

        const lUpperArmGroup = new THREE.Group();
        lClavicle.add(lUpperArmGroup);
        const lBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.35, 8), matArm);
        lBicep.position.set(0, -0.18, 0);
        lUpperArmGroup.add(lBicep);

        const lElbowGroup = new THREE.Group();
        lElbowGroup.position.set(0, -0.36, 0);
        lUpperArmGroup.add(lElbowGroup);
        const lElbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), matJoint);
        lElbowGroup.add(lElbowJoint);

        const lForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.34, 8), matArm);
        lForearm.position.set(0, -0.18, 0);
        lElbowGroup.add(lForearm);

        // --- CHÂN PHẢI (Right Leg Hierarchy) ---
        const rHipJoint = new THREE.Group();
        rHipJoint.position.set(0.14, -0.1, 0);
        pelvisGroup.add(rHipJoint);
        const rHipBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), matJoint);
        rHipJoint.add(rHipBall);

        const rThighGroup = new THREE.Group();
        rHipJoint.add(rThighGroup);
        const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.065, 0.46, 8), matThigh);
        rThigh.position.set(0, -0.24, 0);
        rThighGroup.add(rThigh);

        const rKneeGroup = new THREE.Group();
        rKneeGroup.position.set(0, -0.48, 0);
        rThighGroup.add(rKneeGroup);
        const rKneeJoint = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), matJoint);
        rKneeGroup.add(rKneeJoint);

        const rShin = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.05, 0.44, 8), matCalf);
        rShin.position.set(0, -0.23, 0);
        rKneeGroup.add(rShin);

        const rFoot = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.16), matInactive);
        rFoot.position.set(0, -0.46, 0.04);
        rKneeGroup.add(rFoot);

        // --- CHÂN TRÁI (Left Leg Hierarchy) ---
        const lHipJoint = new THREE.Group();
        lHipJoint.position.set(-0.14, -0.1, 0);
        pelvisGroup.add(lHipJoint);
        const lHipBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), matJoint);
        lHipJoint.add(lHipBall);

        const lThighGroup = new THREE.Group();
        lHipJoint.add(lThighGroup);
        const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.065, 0.46, 8), matThigh);
        lThigh.position.set(0, -0.24, 0);
        lThighGroup.add(lThigh);

        const lKneeGroup = new THREE.Group();
        lKneeGroup.position.set(0, -0.48, 0);
        lThighGroup.add(lKneeGroup);
        const lKneeJoint = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), matJoint);
        lKneeGroup.add(lKneeJoint);

        const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.05, 0.44, 8), matCalf);
        lShin.position.set(0, -0.23, 0);
        lKneeGroup.add(lShin);

        const lFoot = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.16), matInactive);
        lFoot.position.set(0, -0.46, 0.04);
        lKneeGroup.add(lFoot);

        // TƯƠNG TÁC XOAY 360 ĐỘ BẰNG TAY (TOUCH / DRAG)
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let rotY = cameraAngle === "back" ? Math.PI : 0;
        let rotX = 0;

        const onDown = (e) => {
          isDragging = true;
          prevX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          prevY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        };

        const onMove = (e) => {
          if (!isDragging) return;
          const curX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          const curY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

          rotY += (curX - prevX) * 0.01;
          rotX += (curY - prevY) * 0.007;
          rotX = Math.max(-0.4, Math.min(0.6, rotX)); // Khóa góc gật đầu

          pivotRoot.rotation.y = rotY;
          pivotRoot.rotation.x = rotX;

          prevX = curX;
          prevY = curY;
        };

        const onUp = () => { isDragging = false; };

        const dom = renderer.domElement;
        dom.addEventListener("mousedown", onDown);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        dom.addEventListener("touchstart", onDown, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onUp);

        // ================= ĐỘNG HỌC CHUYỂN ĐỘNG (KINEMATIC LOOP) =================
        let clock = new THREE.Clock();
        let reqId = null;

        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          if (exerciseMode === "squat") {
            // Chu kỳ Squat: 0 (đứng thẳng) -> 1 (ngồi sâu vuông góc đùi)
            const phase = (Math.sin(t * 2.2) + 1) / 2;

            // Hông hạ thấp và đẩy nhẹ ra sau
            pelvisGroup.position.set(0, -0.05 - phase * 0.42, -phase * 0.16);
            // Thân trên đổ nhẹ về trước giữ trọng tâm
            spineGroup.rotation.x = phase * 0.35;

            // Khớp háng gập đùi
            rThighGroup.rotation.x = -phase * 1.45;
            lThighGroup.rotation.x = -phase * 1.45;

            // Khớp gối gập cẳng chân
            rKneeGroup.rotation.x = phase * 1.55;
            lKneeGroup.rotation.x = phase * 1.55;

            // Bàn chân giữ phẳng mặt sàn
            rFoot.rotation.x = -phase * 0.1;
            lFoot.rotation.x = -phase * 0.1;

            // Hai tay vươn thẳng về trước thăng bằng
            rUpperArmGroup.rotation.x = -phase * 1.25;
            lUpperArmGroup.rotation.x = -phase * 1.25;
            rElbowGroup.rotation.x = -phase * 0.2;
            lElbowGroup.rotation.x = -phase * 0.2;

          } else if (exerciseMode === "pushup") {
            // Chu kỳ Push-up: 0 (đỉnh chống tay) -> 1 (ngực hạ sát sàn)
            const phase = (Math.sin(t * 2.4) + 1) / 2;

            // Cơ thể nghiêng góc plank 80 độ thẳng tắp từ đầu đến gót
            pelvisGroup.position.set(0, 0.05 - phase * 0.16, 0);
            pelvisGroup.rotation.x = 1.35; // Nằm ngang

            // Trục lưng giữ thẳng tuyệt đối (Plank)
            spineGroup.rotation.x = 0;

            // Tay gập góc khuỷu tay 90 độ hạ ngực
            rUpperArmGroup.rotation.x = -0.3 + phase * 0.6;
            rUpperArmGroup.rotation.z = -0.5 - phase * 0.4;
            rElbowGroup.rotation.x = -phase * 1.4;

            lUpperArmGroup.rotation.x = -0.3 + phase * 0.6;
            lUpperArmGroup.rotation.z = 0.5 + phase * 0.4;
            lElbowGroup.rotation.x = -phase * 1.4;

            // Hai chân duỗi thẳng phía sau
            rThighGroup.rotation.x = 0.1;
            lThighGroup.rotation.x = 0.1;
            rKneeGroup.rotation.x = 0;
            lKneeGroup.rotation.x = 0;

          } else {
            // TƯ THẾ GIẢI PHẪU CHUẨN (NEUTRAL / T-POSE NHẸ)
            pelvisGroup.position.set(0, -0.05, 0);
            pelvisGroup.rotation.set(0, 0, 0);
            spineGroup.rotation.set(0, 0, 0);

            // Hai tay mở góc 20 độ tự nhiên
            rUpperArmGroup.rotation.set(0, 0, -0.25);
            lUpperArmGroup.rotation.set(0, 0, 0.25);
            rElbowGroup.rotation.set(0, 0, 0);
            lElbowGroup.rotation.set(0, 0, 0);

            // Hai chân đứng thẳng
            rThighGroup.rotation.set(0, 0, 0.05);
            lThighGroup.rotation.set(0, 0, -0.05);
            rKneeGroup.rotation.set(0, 0, 0);
            lKneeGroup.rotation.set(0, 0, 0);
          }

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(reqId);
          dom.removeEventListener("mousedown", onDown);
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          dom.removeEventListener("touchstart", onDown);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onUp);
          if (container.contains(dom)) container.removeChild(dom);
          renderer.dispose();
        };
      }, [exerciseMode, cameraAngle]);

      return (
        <div className="relative w-full rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 shadow-2xl">
          <div ref={containerRef} style={{ width: "100%", height: "260px" }} />

          {/* CHÚ THÍCH HỆ MÀU CƠ ANATOMICAL (RED = CHÍNH, ORANGE = PHỤ) */}
          <div className="absolute top-2.5 left-2.5 flex flex-col gap-1 pointer-events-none">
            <span className="text-[10px] font-extrabold uppercase bg-slate-900/90 text-sky-400 border border-slate-700 px-2 py-0.5 rounded backdrop-blur">
              🧍 Anatomical Mannequin
            </span>
            <div className="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-2 py-0.5 rounded text-[9.5px]">
              <span className="flex items-center gap-1 text-rose-400 font-bold">
                <span className="w-2 h-2 rounded-full bg-rose-500 inline-block"></span> Cơ chính
              </span>
              <span className="flex items-center gap-1 text-amber-400 font-bold">
                <span className="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Cơ hỗ trợ
              </span>
            </div>
          </div>

          <div className="absolute bottom-2.5 right-2.5 pointer-events-none text-[9.5px] text-slate-300 bg-slate-900/90 px-2 py-0.5 rounded border border-slate-700">
            👆 Vuốt xoay 360°
          </div>
        </div>
      );
    };

    function App() {
      const [testMode, setTestMode] = useState("squat"); // "squat" | "pushup" | "neutral"
      const [camAngle, setCamAngle] = useState("front"); // "front" | "back"

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 pb-12 safe-top safe-bottom">
          {/* HEADER */}
          <header className="px-4 py-3 border-b border-slate-800 bg-slate-900/95 backdrop-blur flex justify-between items-center">
            <div>
              <h1 className="text-base font-extrabold text-sky-400 flex items-center gap-1.5">
                <span>FitFlow 3D Mannequin</span>
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold">
                  v4.5
                </span>
              </h1>
              <p className="text-[11px] text-slate-400">Khung xương chuẩn • Cơ chính (Đỏ) • Cơ phụ (Cam)</p>
            </div>

            {/* Nút xem Mặt Trước / Mặt Sau */}
            <div className="flex bg-slate-800 p-0.5 rounded-xl border border-slate-700">
              <button
                onClick={() => setCamAngle("front")}
                className={`px-2.5 py-1 text-xs font-bold rounded-lg ${camAngle === "front" ? "bg-sky-600 text-white" : "text-slate-400"}`}
              >
                Trước
              </button>
              <button
                onClick={() => setCamAngle("back")}
                className={`px-2.5 py-1 text-xs font-bold rounded-lg ${camAngle === "back" ? "bg-sky-600 text-white" : "text-slate-400"}`}
              >
                Sau
              </button>
            </div>
          </header>

          {/* KHU VỰC THỬ NGHIỆM CHÍNH */}
          <main className="p-4 space-y-4 flex-1">
            {/* THANH CHỌN BÀI TẬP KIỂM TRA CHUYỂN ĐỘNG */}
            <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
              <button
                onClick={() => setTestMode("squat")}
                className={`py-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 ${
                  testMode === "squat" ? "bg-sky-600 text-white shadow" : "text-slate-400 hover:bg-slate-800"
                }`}
              >
                <span>🦵 Bài 1: Squat</span>
                <span className="text-[9px] opacity-80">Đùi & Mông</span>
              </button>

              <button
                onClick={() => setTestMode("pushup")}
                className={`py-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 ${
                  testMode === "pushup" ? "bg-sky-600 text-white shadow" : "text-slate-400 hover:bg-slate-800"
                }`}
              >
                <span>💪 Bài 2: Push-up</span>
                <span className="text-[9px] opacity-80">Ngực & Tay sau</span>
              </button>

              <button
                onClick={() => setTestMode("neutral")}
                className={`py-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 ${
                  testMode === "neutral" ? "bg-purple-600 text-white shadow" : "text-slate-400 hover:bg-slate-800"
                }`}
              >
                <span>🧍 Chuẩn Giải Phẫu</span>
                <span className="text-[9px] opacity-80">Neutral Pose</span>
              </button>
            </div>

            {/* KHUNG HIỂN THỊ 3D */}
            <AnatomicalMannequin3D exerciseMode={testMode} cameraAngle={camAngle} />

            {/* BẢNG GIẢI THÍCH NHÓM CƠ THEO BÀI ĐANG CHỌN */}
            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
              <h3 className="font-extrabold text-sm text-white flex items-center justify-between">
                <span>
                  {testMode === "squat" && "Động tác: Bodyweight Squat"}
                  {testMode === "pushup" && "Động tác: Standard Push-up"}
                  {testMode === "neutral" && "Tư thế Giải phẫu gốc (Neutral)"}
                </span>
                <span className="text-xs text-sky-400 font-normal">60 FPS</span>
              </h3>

              {testMode === "squat" && (
                <div className="text-xs text-slate-300 space-y-1.5">
                  <p><b className="text-rose-400">🔴 Cơ chính phát lực:</b> Cơ tứ đầu đùi (Quadriceps) tô màu đỏ tươi.</p>
                  <p><b className="text-amber-400">🟠 Cơ phụ hỗ trợ:</b> Cơ mông lớn (Glutes) & Bắp chân (Calves) tô màu cam ấm.</p>
                  <p className="text-[11px] text-slate-400 pt-1">
                    ✓ Khớp gối và khớp háng gập đồng bộ, giữ thân người thăng bằng không bị biến dạng chi.
                  </p>
                </div>
              )}

              {testMode === "pushup" && (
                <div className="text-xs text-slate-300 space-y-1.5">
                  <p><b className="text-rose-400">🔴 Cơ chính phát lực:</b> Cơ ngực lớn (Pectorals) & Cơ tay sau (Triceps) tô màu đỏ tươi.</p>
                  <p><b className="text-amber-400">🟠 Cơ phụ hỗ trợ:</b> Cơ bụng và cơ lõi (Core/Abs) siết chặt giữ đường thẳng.</p>
                  <p className="text-[11px] text-slate-400 pt-1">
                    ✓ Khuỷu tay gập mở góc 45 độ chuẩn giải phẫu, toàn bộ thân người plank song phẳng.
                  </p>
                </div>
              )}

              {testMode === "neutral" && (
                <div className="text-xs text-slate-300 space-y-1.5">
                  <p>Mô hình nhân vật thể thao tối giản (Athletic Low-Poly Mannequin) ở trạng thái đứng nghỉ chuẩn xác.</p>
                  <p className="text-[11px] text-slate-400">
                    Bấm nút <b>"Trước" / "Sau"</b> ở góc trên hoặc dùng ngón tay vuốt ngang để kiểm tra độ cân đối tỉ lệ từ mọi góc độ.
                  </p>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
