  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const MODEL_RAW_URL = "https://raw.githubusercontent.com/anhphamtuan028-prog/Fitflow/main/model.glb";

    // ÂM THANH BÍP & GIỌNG ĐỌC HUẤN LUYỆN VIÊN TIẾNG VIỆT
    const playBeep = (freq = 880, duration = 180, type = "sine") => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch (e) {}
    };

    const speakVN = (text, enabled = true) => {
      if (!enabled || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "vi-VN";
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    };

    // COMPONENT THREE.JS GLTF 3D VIEWER
    const ThreeGLTFViewer = ({ modelUrl = MODEL_RAW_URL, height = 220 }) => {
      const containerRef = useRef(null);
      const [status, setStatus] = useState("loading");
      const [errorDetail, setErrorDetail] = useState("");

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        let isMounted = true;
        let mixer = null;
        let reqId = null;

        const width = container.clientWidth || 340;
        const h = height;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1120);

        const camera = new THREE.PerspectiveCamera(45, width / h, 0.1, 100);
        camera.position.set(0, 1.2, 3.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(width, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 5, 4);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(6, 12, 0x334155, 0x1e293b);
        grid.position.y = -0.95;
        scene.add(grid);

        const pivot = new THREE.Group();
        scene.add(pivot);

        const initLoader = () => {
          if (!window.THREE || !window.THREE.GLTFLoader) {
            setTimeout(initLoader, 150);
            return;
          }

          const loader = new window.THREE.GLTFLoader();
          loader.load(
            modelUrl,
            (gltf) => {
              if (!isMounted) return;
              const model = gltf.scene;

              const box = new THREE.Box3().setFromObject(model);
              const size = box.getSize(new THREE.Vector3());
              const center = box.getCenter(new THREE.Vector3());

              const maxDim = Math.max(size.x, size.y, size.z);
              const scale = 1.8 / (maxDim || 1);
              model.scale.setScalar(scale);

              model.position.x = -center.x * scale;
              model.position.y = -center.y * scale;
              model.position.z = -center.z * scale;

              pivot.add(model);
              setStatus("ready");

              if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
              }
            },
            undefined,
            (err) => {
              if (!isMounted) return;
              console.error("Lỗi nạp GLB:", err);
              setStatus("error");
              setErrorDetail("Không thể nạp file model.glb từ GitHub");
            }
          );
        };

        initLoader();

        // Xoay chạm vuốt 360 độ
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let rotY = 0, rotX = 0;

        const onDown = (e) => {
          isDragging = true;
          prevX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          prevY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        };
        const onMove = (e) => {
          if (!isDragging) return;
          const curX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          const curY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          rotY += (curX - prevX) * 0.01;
          rotX += (curY - prevY) * 0.007;
          rotX = Math.max(-0.5, Math.min(0.6, rotX));
          pivot.rotation.y = rotY;
          pivot.rotation.x = rotX;
          prevX = curX;
          prevY = curY;
        };
        const onUp = () => { isDragging = false; };

        const dom = renderer.domElement;
        dom.addEventListener("mousedown", onDown);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        dom.addEventListener("touchstart", onDown, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onUp);

        let clock = new THREE.Clock();
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const delta = clock.getDelta();
          if (mixer) mixer.update(delta);
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          isMounted = false;
          cancelAnimationFrame(reqId);
          dom.removeEventListener("mousedown", onDown);
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          dom.removeEventListener("touchstart", onDown);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onUp);
          if (container.contains(dom)) container.removeChild(dom);
          renderer.dispose();
        };
      }, [modelUrl, height]);

      return (
        <div className="relative w-full rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 shadow-2xl mb-2.5">
          <div ref={containerRef} style={{ width: "100%", height: `${height}px` }} />

          {status === "loading" && (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur pointer-events-none">
              <div className="w-6 h-6 border-2 border-sky-400 border-t-transparent rounded-full animate-spin mb-2"></div>
              <span className="text-xs text-sky-300 font-semibold">Đang nạp mô hình 3D...</span>
            </div>
          )}

          {status === "error" && (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-4 text-center">
              <span className="text-lg mb-1">⚠️</span>
              <p className="text-xs font-bold text-rose-400">{errorDetail}</p>
            </div>
          )}

          {status === "ready" && (
            <>
              <div className="absolute top-2.5 left-2.5 pointer-events-none">
                <span className="text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-md backdrop-blur">
                  🧍 Mixamo 3D Active

              </div>
              <div className="absolute bottom-2.5 right-2.5 pointer-events-none text-[9.5px] text-slate-300 bg-slate-900/90 px-2 py-0.5 rounded border border-slate-700">
                👆 Vuốt xoay 360°
              </div>
            </>
          )}
        </div>
      );
    };

                  <line x1="45" y1="82" x2="95" y2="24" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                  <line x1="95" y1="24" x2="145" y2="54" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <circle cx="138" cy="48" r="6" fill="#22c55e" opacity="0.85" />
                  <line x1="145" y1="54" x2="155" y2="82" stroke="#e2e8f0" strokeWidth="5" strokeLinecap="round" />
                  <circle cx="156" cy="54" r="7" fill="#fcd34d" />
                </g>
              )}
            </svg>
          );
        }

        if (type === "squat") {
          return (
            <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-slate-700/80 mb-1.5">
              <line x1="10" y1="84" x2="220" y2="84" stroke="#334155" strokeWidth="3" />

              <text x="56" y="17" fill="#fca5a5" fontSize="9.5" fontWeight="bold" textAnchor="middle">
                🔥 {muscleHighlight || "Đùi & Mông"}
              </text>
              <rect x="160" y="6" width="60" height="18" rx="4" fill="#000000bb" />
              <text x="190" y="18" fill="#fff" fontSize="11" fontWeight="bold" textAnchor="middle">
                STEP {stepIndex + 1}
              </text>
              {stepIndex === 0 && (
                <g>
                  <line x1="90" y1="15" x2="90" y2="82" stroke="#ef4444" strokeWidth="2.5" strokeDasharray="4" />

                  <line x1="110" y1="32" x2="136" y2="32" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                </g>

              {stepIndex === 1 && (
                <g>
                  <line x1="68" y1="25" x2="68" y2="62" stroke="#ef4444" strokeWidth="3" />
                  <polygon points="68,62 63,53 73,53" fill="#ef4444" />
                  <circle cx="115" cy="30" r="7" fill="#fcd34d" />
                  <line x1="112" y1="38" x2="92" y2="58" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <line x1="92" y1="58" x2="118" y2="58" stroke="#ef4444" strokeWidth="6" strokeLinecap="round" />
                  <line x1="118" y1="58" x2="112" y2="82" stroke="#e2e8f0" strokeWidth="5" strokeLinecap="round" />
                  <line x1="110" y1="42" x2="140" y2="42" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                </g>
              )}
              {stepIndex === 2 && (
                <g>
                  <line x1="68" y1="65" x2="68" y2="25" stroke="#22c55e" strokeWidth="3" />
                  <polygon points="68,25 63,34 73,34" fill="#22c55e" />
                  <circle cx="110" cy="18" r="7" fill="#fcd34d" />
                  <line x1="110" y1="26" x2="110" y2="52" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <line x1="110" y1="52" x2="110" y2="82" stroke="#22c55e" strokeWidth="6" strokeLinecap="round" />
                </g>
              )}
            </svg>
          );
        }

        return (
          <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-slate-700/80 mb-1.5">
            <line x1="10" y1="84" x2="220" y2="84" stroke="#334155" strokeWidth="3" />
            <rect x="8" y="6" width="96" height="17" rx="4" fill="#ef444425" stroke="#ef444460" />
            <text x="56" y="17" fill="#fca5a5" fontSize="9.5" fontWeight="bold" textAnchor="middle">
              🔥 {muscleHighlight || "Bụng & Lưng"}
            </text>
            <rect x="160" y="6" width="60" height="18" rx="4" fill="#000000bb" />
            <text x="190" y="18" fill="#fff" fontSize="11" fontWeight="bold" textAnchor="middle">
              STEP {stepIndex + 1}
            </text>
            {stepIndex === 0 && (
              <g>
                <line x1="35" y1="45" x2="165" y2="45" stroke="#ef4444" strokeWidth="2.5" />
                <line x1="45" y1="82" x2="95" y2="55" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                <line x1="95" y1="55" x2="150" y2="55" stroke="#ef4444" strokeWidth="7" strokeLinecap="round" />
                <line x1="150" y1="55" x2="150" y2="82" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                <circle cx="162" cy="55" r="7" fill="#fcd34d" />
              </g>
            )}
            {stepIndex === 1 && (
              <g>
                <line x1="115" y1="76" x2="115" y2="38" stroke="#ef4444" strokeWidth="3" />
                <polygon points="115,38 110,46 120,46" fill="#ef4444" />
                <line x1="45" y1="82" x2="95" y2="48" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                <line x1="95" y1="48" x2="150" y2="52" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                <line x1="150" y1="52" x2="150" y2="82" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                <circle cx="162" cy="52" r="7" fill="#fcd34d" />
              </g>
            )}
            {stepIndex === 2 && (
              <g>
                <line x1="95" y1="34" x2="145" y2="34" stroke="#22c55e" strokeWidth="3" />
                <line x1="45" y1="82" x2="95" y2="52" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                <line x1="95" y1="52" x2="150" y2="52" stroke="#22c55e" strokeWidth="7" strokeLinecap="round" />
                <line x1="150" y1="52" x2="150" y2="82" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                <circle cx="162" cy="52" r="7" fill="#fcd34d" />
              </g>
            )}
          </svg>
        );
      };

      if (isLive) return <div className="p-0.5">{renderPose(liveStep)}</div>;
      return (
        <div className="space-y-1">
          {renderPose(0)}
          {renderPose(1)}
          {renderPose(2)}
        </div>
      );
    };

    // KHỞI ĐỘNG & GIÃN CƠ
    const STANDARD_WARMUP = [
      {
        id: "wu_auto_1",
        phaseTag: "🔥 KHỞI ĐỘNG ĐẦU BUỔI",
        name: "Xoay Mở Khớp Vai, Cổ Tay & Cổ Chân",
        baseSets: 1,
        repsText: "60 giây",
        workSec: 60,
        rest: 15,

        muscle: "Dịch Khớp & Cổ Chân",

          "STEP 3: Sẵn sàng vào các bài tập chính."

    ];

    const STANDARD_COOLDOWN = [
      {
        id: "cd_auto_1",
        phaseTag: "🧘 GIÃN CƠ CUỐI BUỔI",
        name: "Child's Pose (Tư Thế Em Bé Thả Lỏng Lưng)",
        baseSets: 1,
        repsText: "60 giây",
        workSec: 60,
        rest: 15,
        type: "pike",
        muscle: "Thắt Lưng & Khớp Vai",
        steps: [
          "STEP 1: Quỳ gối trên sàn, ngồi lùi mông chạm nhẹ lên hai gót chân.",

      }
    ];

    // LỊCH TẬP 7 NGÀY
    const WORKOUT_PLAN = [
      {
        day: "Thứ 2",
        title: "Thân Trên & Chống Gù Cột Sống",
        duration: "35 phút",
        isRest: false,
        focus: "Mở ngực, khỏe bả vai, giải phóng áp lực đĩa đệm",
        exercises: [
          {
            id: "m1",
            name: "Incline Push-up (Chống đẩy điểm tựa)",
            baseSets: 3,
            repsText: "12 lần",
            workSec: 45,
            rest: 45,
            type: "pushup",
            muscle: "Ngực & Tay sau",
            steps: [
              "STEP 1: Chống hai tay lên mặt bàn hoặc sàn, lưng - mông tạo thành đường thẳng.",
              "STEP 2: Hạ ngực xuống chậm rãi, khép khuỷu tay 45 độ so với thân.",
              "STEP 3: Đẩy mạnh thân người trở về vị trí ban đầu."
            ],
            alt: {
              name: "Wall Push-up (Chống đẩy tường êm khớp)",
              repsText: "15 lần",
              steps: [

                  </div>
                  <div className="w-full bg-slate-800 h-2 rounded-full mt-2 overflow-hidden">
                    <div className="bg-sky-500 h-full" style={{ width: `${Math.min(100, (stats.water / 11) * 100)}%` }} />
                  </div>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => setStats(s => ({ ...s, water: Math.max(0, s.water - 1) }))} className="px-3 py-2 bg-slate-800 rounded-xl text-xs font-bold">-1</button>
                    <button onClick={() => { setStats(s => ({ ...s, water: s.water + 1, xp: s.xp + 5 })); playBeep(880, 100); }} className="flex-1 py-2 bg-sky-600 rounded-xl text-xs font-bold text-white">+ Uống 1 cốc 250ml (+5 XP)</button>
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                  <h3 className="font-bold text-sm text-emerald-400">🥗 Thực đơn {currentMeal.day}</h3>
                  <div className="text-xs space-y-2 text-slate-300">
                    <div className="p-2 bg-slate-950 rounded-xl border border-slate-800"><b className="text-amber-300">☀️ Sáng: </b>{currentMeal.b}</div>
                    <div className="p-2 bg-slate-950 rounded-xl border border-slate-800"><b className="text-sky-300">🍱 Trưa: </b>{currentMeal.l}</div>
                    <div className="p-2 bg-slate-950 rounded-xl border border-slate-800"><b className="text-purple-300">🍎 Phụ: </b>{currentMeal.s}</div>
                    <div className="p-2 bg-slate-950 rounded-xl border border-slate-800"><b className="text-emerald-300">🌙 Tối: </b>{currentMeal.d}</div>
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                  <h3 className="font-bold text-sm text-amber-400">🔎 Tra Cứu Nhanh Thực Phẩm Purin</h3>
                  {PURINE_DB.map((f, i) => (
                    <div key={i} className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                      <div>
                        <b className="text-white">{f.level === "green" ? "🟢 " : f.level === "yellow" ? "🟡 " : "🔴 "}{f.name}</b>
                        <p className="text-[11px] text-slate-400 mt-0.5">{f.tip}</p>
                      </div>
                      <span className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono shrink-0 ml-2">{f.mg}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MÀN HÌNH PLAYER TOÀN MÀN HÌNH */}
          {playerOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between p-4 safe-top safe-bottom">
              {playerPhase !== "finish" ? (
                <>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
                    <div>
                      <span className="text-xs font-bold uppercase text-sky-400">
                        {activeCurrentEx.phaseTag || "🔥 BÀI TẬP CHÍNH"} ({playerExIdx + 1}/{currentWorkout.exercises.length})
                      </span>
                      <h2 className="text-base font-extrabold text-white">{activeCurrentEx.name}</h2>
                    </div>
                    <button onClick={() => setPlayerOpen(false)} className="px-3 py-1.5 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">✕ Thoát</button>
                  </div>

                  <div className="my-auto space-y-2 text-center">
                    {playerPhase === "prepare" && (
                      <div className="bg-amber-500/20 border border-amber-500/40 py-1.5 rounded-xl animate-pulse">
                        <span className="text-xs font-extrabold text-amber-300 uppercase">⚡ CHUẨN BỊ VÀO TƯ THẾ (5 GIÂY)</span>
                      </div>
                    )}
                    {playerPhase === "work" && (
                      <span className="inline-block px-4 py-0.5 rounded-full text-xs font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        🔥 ĐANG THỰC HIỆN
                      </span>
                    )}
                    {playerPhase === "rest" && (
                      <span className="inline-block px-4 py-0.5 rounded-full text-xs font-extrabold uppercase bg-sky-500/20 text-sky-300 border border-sky-500/40">
                        💧 NGHỈ HÍT THỞ SÂU
                      </span>
                    )}

                    <div className="text-5xl font-mono font-black text-white animate-ring">
                      {formatTime(playerSec)}
                    </div>

                    {playerPhase === "rest" && nextExItem ? (
                      <div className="bg-sky-950/60 border border-sky-600/40 p-3 rounded-2xl text-left space-y-1">
                        <span className="text-[10px] font-bold uppercase text-sky-300 bg-sky-500/20 px-2 py-0.5 rounded">⏭️ Bài tiếp theo chuẩn bị</span>
                        <h4 className="text-sm font-extrabold text-white">{nextExItem.name}</h4>
                        <p className="text-[11px] text-slate-300">🎯 Trọng tâm: {nextExItem.muscle}</p>
                      </div>
                    ) : (
                      <>
                        <ThreeGLTFViewer modelUrl={MODEL_RAW_URL} height={220} />
                        <StepDiagram type={activeCurrentEx.type} isLive={true} muscleHighlight={activeCurrentEx.muscle} />
                      </>
                    )}
                  </div>

                  <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800">
                    <button onClick={() => setPlayerSec(s => s + 15)} className="py-2.5 bg-slate-800 rounded-xl text-xs font-bold text-slate-200">+15s</button>
                    <button onClick={() => setPlayerPaused(!playerPaused)} className="py-2.5 bg-sky-600 rounded-xl text-xs font-extrabold text-white">{playerPaused ? "▶️ Tiếp tục" : "⏸️ Tạm dừng"}</button>
                    <button onClick={() => setPlayerSec(0)} className="py-2.5 bg-emerald-600 rounded-xl text-xs font-extrabold text-white">Bỏ qua ⏭️</button>
                  </div>
                </>
              ) : (
                <div className="my-auto text-center space-y-4 p-2">
                  <div className="text-5xl">🏆</div>
                  <h2 className="text-xl font-extrabold text-emerald-400">Hoàn Thành Buổi Tập!</h2>
                  <div className="space-y-2 pt-2">
                    <button onClick={() => { setStats(p => ({ ...p, xp: p.xp + 50, streak: p.streak + 1 })); setPlayerOpen(false); }} className="w-full py-3 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl text-xs font-bold text-emerald-300">💪 Hoàn tất (+50 XP)</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* BOTTOM NAVBAR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 safe-bottom z-30">
            <div className="max-w-md mx-auto grid grid-cols-2 p-1.5 gap-1">
              <button onClick={() => setActiveTab("workout")} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center ${activeTab === "workout" ? "bg-sky-600 text-white" : "text-slate-400"}`}>
                <span>🏋️ Lịch Tập 3D</span>
              </button>
              <button onClick={() => setActiveTab("diet")} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center ${activeTab === "diet" ? "bg-sky-600 text-white" : "text-slate-400"}`}>
                <span>🥗 Axit Uric & Nước</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
