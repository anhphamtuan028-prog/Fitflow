    // 1. ÂM THANH BÍP & GIỌNG HLV TIẾNG VIỆT
    const playBeep = (freq = 880, duration = 180, type = "sine") => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch (e) {}
    };

    const speakVN = (text, enabled = true) => {
      if (!enabled || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "vi-VN";
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    };

    // 2. KHỐI THREE.JS PROCEDURAL 3D CANVAS TƯƠNG TÁC XOAY 360 ĐỘ
    const ThreeExerciseCanvas = ({ type = "squat", height = 180 }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const width = container.clientWidth || 320;
        const h = height;

        // Thiết lập Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1120);

        const camera = new THREE.PerspectiveCamera(40, width / h, 0.1, 50);
        camera.position.set(0, 1.8, 5.2);
        camera.lookAt(0, 1.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(width, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(3, 5, 4);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x10b981, 0.6);
        backLight.position.set(-3, 3, -3);
        scene.add(backLight);

        // Lưới sàn phòng tập 3D
        const grid = new THREE.GridHelper(6, 12, 0x0284c7, 0x1e293b);
        grid.position.y = 0;
        scene.add(grid);

        // Chất liệu cho nhân vật
        const matBody = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, metalness: 0.1 });
        const matJoint = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });
        const matHead = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.3 });
        const matLimb = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 });
        const matProp = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7 });

        // Tạo nhóm nhân vật gốc
        const character = new THREE.Group();
        scene.add(character);

        // Đầu
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), matHead);
        head.position.y = 2.05;
        character.add(head);

        // Thân trên (Torso)
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.7, 16), matBody);
        torso.position.y = 1.45;
        character.add(torso);

        // Khớp vai & Khớp háng
        const shoulderR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), matJoint);
        shoulderR.position.set(0.35, 1.7, 0);
        character.add(shoulderR);

        const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), matJoint);
        shoulderL.position.set(-0.35, 1.7, 0);
        character.add(shoulderL);

        const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), matLimb);
        armR.position.set(0.38, 1.35, 0);
        character.add(armR);

        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), matLimb);
        armL.position.set(-0.38, 1.35, 0);
        character.add(armL);

        // Chân phải
        const legRGroup = new THREE.Group();
        legRGroup.position.set(0.18, 1.1, 0);
        const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.95, 8), matLimb);
        legR.position.y = -0.48;
        legRGroup.add(legR);
        character.add(legRGroup);

        // Chân trái
        const legLGroup = new THREE.Group();
        legLGroup.position.set(-0.18, 1.1, 0);
        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.95, 8), matLimb);
        legL.position.y = -0.48;
        legLGroup.add(legL);
        character.add(legLGroup);

        // Bổ sung đạo cụ tương tác hình học (Tường hoặc Ghế) tùy theo bài tập
        let propWall = null;
        let propChair = null;

        if (type === "wall") {
          propWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3.2, 2.5), matProp);
          propWall.position.set(1.1, 1.6, 0);
          scene.add(propWall);
        } else if (type === "chair") {
          propChair = new THREE.Group();
          const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 0.8), matProp);
          seat.position.y = 0.7;
          propChair.add(seat);
          const back = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.8), matProp);
          back.position.set(-0.36, 1.1, 0);
          propChair.add(back);
          scene.add(propChair);
        }

        // Tương tác vuốt xoay 360 độ (Touch / Mouse)
        let isDragging = false;
        let prevX = 0;
        let rotSpeed = 0.007;

        const onPointerDown = (e) => {
          isDragging = true;
          prevX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const curX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          const deltaX = curX - prevX;
          character.rotation.y += deltaX * rotSpeed;
          prevX = curX;
        };

        const onPointerUp = () => { isDragging = false; };

        const dom = renderer.domElement;
        dom.addEventListener("mousedown", onPointerDown);
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);
        dom.addEventListener("touchstart", onPointerDown, { passive: true });
        window.addEventListener("touchmove", onPointerMove, { passive: true });
        window.addEventListener("touchend", onPointerUp);

        // Vòng lặp hoạt ảnh chuyển động 3D (Kinematic Animation Loop)
        let clock = new THREE.Clock();
        let reqId = null;

        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          if (type === "squat") {
            const squatCycle = (Math.sin(t * 2.2) + 1) / 2; // 0 -> 1
            character.position.y = -squatCycle * 0.45;
            legRGroup.rotation.x = -squatCycle * 0.8;
            legLGroup.rotation.x = -squatCycle * 0.8;
            armR.rotation.x = -squatCycle * 1.2;
            armL.rotation.x = -squatCycle * 1.2;
            torso.rotation.x = squatCycle * 0.25;
          } else if (type === "pushup" || type === "pike") {
            character.rotation.z = 0;
            character.position.y = -0.5;
            character.rotation.x = Math.PI / 2.3;
            const pushCycle = (Math.sin(t * 2.5) + 1) / 2;
            torso.position.y = 1.45 - pushCycle * 0.2;
            head.position.y = 2.05 - pushCycle * 0.25;
          } else if (type === "walk" || type === "run") {
            const speed = type === "run" ? 5 : 3;
            legRGroup.rotation.x = Math.sin(t * speed) * 0.6;
            legLGroup.rotation.x = -Math.sin(t * speed) * 0.6;
            armR.rotation.x = -Math.sin(t * speed) * 0.7;
            armL.rotation.x = Math.sin(t * speed) * 0.7;
            character.position.y = Math.abs(Math.sin(t * speed)) * 0.08;
          } else if (type === "chair") {
            character.position.set(0, -0.1, 0);
            legRGroup.rotation.x = -1.4;
            legLGroup.rotation.x = -1.4;
            const stretch = Math.sin(t * 2) * 0.3;
            torso.rotation.y = stretch;
            head.rotation.y = stretch;
          } else if (type === "wall") {
            const wallSlide = (Math.sin(t * 2) + 1) / 2;
            character.position.set(0.65, -wallSlide * 0.35, 0);
            legRGroup.rotation.x = -wallSlide * 0.6;
            legLGroup.rotation.x = -wallSlide * 0.6;
            armR.rotation.z = Math.PI / 4 + wallSlide * 0.5;
            armL.rotation.z = -Math.PI / 4 - wallSlide * 0.5;
          } else {
            // Mặc định: Giãn cơ hoặc Plank
            character.rotation.x = Math.PI / 2.2;
            character.position.y = -0.6;
            const breath = Math.sin(t * 1.5) * 0.06;
            torso.scale.set(1 + breath, 1, 1 + breath);
          }

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(reqId);
          dom.removeEventListener("mousedown", onPointerDown);
          window.removeEventListener("mousemove", onPointerMove);
          window.removeEventListener("mouseup", onPointerUp);
          dom.removeEventListener("touchstart", onPointerDown);
          window.removeEventListener("touchmove", onPointerMove);
          window.removeEventListener("touchend", onPointerUp);
          if (container.contains(dom)) container.removeChild(dom);
          renderer.dispose();
        };
      }, [type, height]);

      return (
        <div className="relative w-full rounded-2xl overflow-hidden border border-sky-900/60 shadow-inner bg-slate-950">
          <div ref={containerRef} style={{ width: "100%", height: `${height}px` }} />
          <div className="absolute top-2 left-2.5 pointer-events-none flex items-center gap-1.5">
            <span className="text-[10px] font-extrabold uppercase bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md">
              🧊 3D Procedural Engine
            </span>
          </div>
          <div className="absolute bottom-2 right-2.5 pointer-events-none text-[9.5px] text-slate-400 bg-slate-900/80 px-2 py-0.5 rounded border border-slate-800">
            👆 Vuốt xoay 360°
          </div>
        </div>
      );
    };

      { name: "Đậu phụ / Đậu hũ", level: "green", mg: "~20-35 mg", tip: "Đạm thực vật tinh khiết lành tính cho người gout/axit uric cao." },
      { name: "Ức gà (đã luộc chần bỏ nước đầu)", level: "yellow", mg: "~130 mg", tip: "Ăn 80-100g/bữa, luôn bỏ nước luộc để loại bỏ purin hòa tan." },
      { name: "Thịt bò, Hải sản có vỏ, Lòng mề", level: "red", mg: ">250 mg", tip: "Cần kiêng triệt để trong giai đoạn chỉ số axit uric đang cao." }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("workout");
      const [selectedDayIdx, setSelectedDayIdx] = useState(0);
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [viewMode3D, setViewMode3D] = useState(true); // Bật/tắt chế độ xem 3D

      const [stats, setStats] = useState(() => {
        try { return JSON.parse(localStorage.getItem("fitflow_stats_v42") || '{"xp":180,"streak":3,"water":5,"doneIds":[]}'); } catch { return { xp: 180, streak: 3, water: 5, doneIds: [] }; }
      });

      // Guided Player
      const [playerOpen, setPlayerOpen] = useState(false);
      const [playerExIdx, setPlayerExIdx] = useState(0);
      const [playerPhase, setPlayerPhase] = useState("prepare");
      const [playerSec, setPlayerSec] = useState(5);
      const [playerPaused, setPlayerPaused] = useState(false);

      useEffect(() => { localStorage.setItem("fitflow_stats_v42", JSON.stringify(stats)); }, [stats]);

      const currentWorkout = WORKOUT_PLAN[selectedDayIdx];

      const startGuidedSession = () => {
        const firstEx = currentWorkout.exercises[0];
        setPlayerExIdx(0);
        setPlayerPhase("prepare");
        setPlayerSec(5);
        setPlayerPaused(false);
        setPlayerOpen(true);
        playBeep(880, 200);
        speakVN(`Chuẩn bị vào bài tập: ${firstEx.name}`, voiceEnabled);
      };

      useEffect(() => {
        if (!playerOpen || playerPaused || playerPhase === "finish") return;

        if (playerSec <= 0) {
          const exercises = currentWorkout.exercises;
          const currEx = exercises[playerExIdx];

          if (playerPhase === "prepare") {
            setPlayerPhase("work");
            setPlayerSec(currEx.workSec || 45);
            playBeep(1046, 250);
            speakVN("Bắt đầu thực hiện", voiceEnabled);
          } else if (playerPhase === "work") {
            setStats(p => ({ ...p, xp: p.xp + 25, doneIds: p.doneIds.includes(currEx.id) ? p.doneIds : [...p.doneIds, currEx.id] }));
            if (playerExIdx + 1 < exercises.length) {
              setPlayerPhase("rest");
              setPlayerSec(currEx.rest || 30);
              playBeep(660, 250);
              speakVN(`Nghỉ ngơi. Bài tiếp theo: ${exercises[playerExIdx + 1].name}`, voiceEnabled);
            } else {
              setPlayerPhase("finish");
              playBeep(1046, 450);
              speakVN("Chúc mừng bạn đã hoàn thành xuất sắc buổi tập!", voiceEnabled);
            }
          } else if (playerPhase === "rest") {
            const nextIdx = playerExIdx + 1;
            setPlayerExIdx(nextIdx);
            setPlayerPhase("prepare");
            setPlayerSec(5);
            playBeep(880, 200);
            speakVN(`Chuẩn bị tư thế cho: ${exercises[nextIdx].name}`, voiceEnabled);
          }
          return;
        }

        if (playerSec === 10 && playerPhase === "work") speakVN("Còn 10 giây", voiceEnabled);
        if (playerSec <= 3 && playerSec >= 1) playBeep(740, 90);

        const timer = setInterval(() => setPlayerSec(s => s - 1), 1000);
        return () => clearInterval(timer);
      }, [playerOpen, playerPaused, playerSec, playerPhase, playerExIdx, currentWorkout, voiceEnabled]);

      const formatTime = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      const activeCurrentEx = currentWorkout.exercises[playerExIdx] || {};
      const nextExItem = currentWorkout.exercises[playerExIdx + 1] || null;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 pb-24">
          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3.5 py-2.5 safe-top">
            <div className="flex items-center justify-between">
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="text-base font-extrabold text-sky-400">FitFlow 3D</h1>
                  <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">
                    🔥 {stats.streak} Ngày
                  </span>
                  <span className="text-[10px] bg-sky-500/20 text-sky-300 border border-sky-500/40 px-2 py-0.5 rounded-full font-bold">
                    {stats.xp} XP
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 mt-0.5">Three.js Procedural • 60 FPS • Xoay 360°</p>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setViewMode3D(!viewMode3D)}
                  className={`text-[11px] px-2.5 py-1 rounded-xl border font-bold ${
                    viewMode3D ? "bg-sky-600 text-white border-sky-400" : "bg-slate-800 text-slate-400 border-slate-700"
                  }`}
                >
                  {viewMode3D ? "🧊 3D: BẬT" : "2D"}
                </button>
                <button
                  onClick={() => setVoiceEnabled(!voiceEnabled)}
                  className={`text-[11px] px-2.5 py-1 rounded-xl border font-bold ${
                    voiceEnabled ? "bg-emerald-600 text-white border-emerald-400" : "bg-slate-800 text-slate-400 border-slate-700"
                  }`}
                >
                  {voiceEnabled ? "🔊" : "🔇"}
                </button>
              </div>
            </div>
          </header>

          {/* CHỌN THỨ TRONG TUẦN */}
          <div className="px-3 pt-2.5">
            <div className="grid grid-cols-7 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
              {WORKOUT_PLAN.map((d, idx) => (
                <button
                  key={d.day}
                  onClick={() => setSelectedDayIdx(idx)}
                  className={`py-1.5 rounded-lg text-center transition ${
                    idx === selectedDayIdx
                      ? "bg-sky-600 text-white font-bold shadow"
                      : d.isRest ? "text-emerald-400 hover:bg-slate-800" : "text-slate-400 hover:bg-slate-800"
                  }`}
                >
                  <div className="text-[11px]">{d.day.replace("Thứ ", "T").replace("Chủ Nhật", "CN")}</div>
                  <div className="text-[9px] opacity-80">{d.isRest ? "Nghỉ" : "Tập"}</div>
                </button>
              ))}
            </div>
          </div>

          {/* NỘI DUNG CHÍNH */}
          <main className="p-3 space-y-3.5 flex-1">
            {activeTab === "workout" && (
              <div className="space-y-3">
                {/* Banner buổi tập */}
                <div className="p-4 rounded-2xl border bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950/60 border-slate-700/80 shadow-lg">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs font-bold text-sky-400 uppercase">{currentWorkout.day} • {currentWorkout.duration}</span>
                      <h2 className="text-base font-extrabold mt-0.5">{currentWorkout.title}</h2>
                    </div>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full font-semibold">
                      {currentWorkout.exercises.length} Động tác
                    </span>
                  </div>
                  <p className="text-xs text-slate-300 mt-1">🎯 {currentWorkout.focus}</p>

                  <button
                    onClick={startGuidedSession}
                    className="mt-3 w-full py-2.5 bg-gradient-to-r from-sky-500 to-emerald-500 text-slate-950 font-extrabold text-xs rounded-xl shadow-md flex items-center justify-center gap-2"
                  >
                    <span>▶️ BẮT ĐẦU BUỔI TẬP 3D (CÓ 5S CHUẨN BỊ & XEM TRƯỚC BÀI SAU)</span>
                  </button>
                </div>

                {/* Danh sách bài tập có Three.js 3D Canvas */}
                {currentWorkout.exercises.map((ex) => {
                  const isDone = stats.doneIds.includes(ex.id);
                  return (
                    <div key={ex.id} className={`p-3.5 rounded-2xl border transition ${isDone ? "bg-emerald-950/20 border-emerald-700/60" : "bg-slate-900 border-slate-800"}`}>
                      <div className="flex justify-between items-start gap-2 mb-2">
                        <div>
                          <h3 className="font-bold text-sm text-white">{ex.name}</h3>
                          <p className="text-xs text-sky-400 font-semibold mt-0.5">{ex.baseSets} hiệp × {ex.repsText} • Nghỉ {ex.rest}s</p>
                        </div>
                        <button
                          onClick={() => setStats(p => ({
                            ...p,
                            xp: isDone ? p.xp - 15 : p.xp + 20,
                            doneIds: isDone ? p.doneIds.filter(i => i !== ex.id) : [...p.doneIds, ex.id]
                          }))}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold ${isDone ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300 border border-slate-700"}`}
                        >
                          {isDone ? "✓ Xong" : "Hoàn thành"}
                        </button>
                      </div>

                      {/* Khối Three.js 3D tương tác xoay 360 độ */}
                      {viewMode3D && <ThreeExerciseCanvas type={ex.type} height={175} />}

                      {/* Các bước hướng dẫn */}
                      <div className="mt-2.5 space-y-1 bg-slate-950/75 p-2.5 rounded-xl border border-slate-800/80">
                        {ex.steps.map((st, i) => (
                          <p key={i} className="text-xs text-slate-300 leading-relaxed">{st}</p>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {activeTab === "diet" && (
              <div className="space-y-3">
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-sm text-sky-400">💧 Nước lọc đào thải Axit Uric</h3>
                      <p className="text-xs text-slate-400">Mục tiêu: 11 cốc (2.75 Lít/ngày)</p>
                    </div>
                    <span className="text-lg font-extrabold text-white">{stats.water} / 11 cốc</span>
                  </div>
                  <div className="w-full bg-slate-800 h-2 rounded-full mt-2 overflow-hidden">
                    <div className="bg-sky-500 h-full" style={{ width: `${Math.min(100, (stats.water / 11) * 100)}%` }} />
                  </div>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => setStats(s => ({ ...s, water: Math.max(0, s.water - 1) }))} className="px-3 py-2 bg-slate-800 rounded-xl text-xs font-bold">-1</button>
                    <button onClick={() => { setStats(s => ({ ...s, water: s.water + 1, xp: s.xp + 5 })); playBeep(880, 100); }} className="flex-1 py-2 bg-sky-600 rounded-xl text-xs font-bold text-white">+ Uống 1 cốc 250ml (+5 XP)</button>
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                  <h3 className="font-bold text-sm text-emerald-400">🥗 Thực phẩm An Toàn cho Người Axit Uric Cao</h3>
                  {PURINE_DB.map((f, i) => (
                    <div key={i} className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                      <div>
                        <b className="text-white">{f.name}</b>
                        <p className="text-[11px] text-slate-400 mt-0.5">{f.tip}</p>
                      </div>
                      <span className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono shrink-0 ml-2">{f.mg}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MÀN HÌNH WORKOUT PLAYER TOÀN MÀN HÌNH TÍCH HỢP 3D & PREPARE 5S */}
          {playerOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between p-4 safe-top safe-bottom">
              {playerPhase !== "finish" ? (
                <>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
                    <div>
                      <span className="text-xs font-bold uppercase text-sky-400">
                        Bài {playerExIdx + 1} / {currentWorkout.exercises.length}
                      </span>
                      <h2 className="text-base font-extrabold text-white">{activeCurrentEx.name}</h2>
                    </div>
                    <button onClick={() => setPlayerOpen(false)} className="px-3 py-1.5 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">✕ Thoát</button>
                  </div>

                  <div className="my-auto space-y-2 text-center">
                    {playerPhase === "prepare" && (
                      <div className="bg-amber-500/20 border border-amber-500/40 py-1.5 rounded-xl">
                        <span className="text-xs font-extrabold text-amber-300 uppercase">⚡ CHUẨN BỊ VÀO TƯ THẾ (5 GIÂY)</span>
                      </div>
                    )}
                    {playerPhase === "work" && (
                      <span className="inline-block px-4 py-0.5 rounded-full text-xs font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        🔥 ĐANG THỰC HIỆN
                      </span>
                    )}
                    {playerPhase === "rest" && (
                      <span className="inline-block px-4 py-0.5 rounded-full text-xs font-extrabold uppercase bg-sky-500/20 text-sky-300 border border-sky-500/40">
                        💧 NGHỈ HÍT THỞ SÂU
                      </span>
                    )}

                    <div className="text-5xl font-mono font-black text-white">
                      {formatTime(playerSec)}
                    </div>

                    {playerPhase === "rest" && nextExItem ? (
                      <div className="bg-sky-950/60 border border-sky-600/40 p-3 rounded-2xl text-left space-y-1">
                        <span className="text-[10px] font-bold uppercase text-sky-300 bg-sky-500/20 px-2 py-0.5 rounded">⏭️ Bài tiếp theo chuẩn bị</span>
                        <h4 className="text-sm font-extrabold text-white">{nextExItem.name}</h4>
                        <p className="text-[11px] text-slate-300">🎯 Trọng tâm: {nextExItem.muscle}</p>
                      </div>
                    ) : (
                      <ThreeExerciseCanvas type={activeCurrentEx.type} height={210} />
                    )}
                  </div>

                  <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800">
                    <button onClick={() => setPlayerSec(s => s + 15)} className="py-2.5 bg-slate-800 rounded-xl text-xs font-bold text-slate-200">+15s</button>
                    <button onClick={() => setPlayerPaused(!playerPaused)} className="py-2.5 bg-sky-600 rounded-xl text-xs font-extrabold text-white">{playerPaused ? "▶️ Tiếp tục" : "⏸️ Tạm dừng"}</button>
                    <button onClick={() => setPlayerSec(0)} className="py-2.5 bg-emerald-600 rounded-xl text-xs font-extrabold text-white">Bỏ qua ⏭️</button>
                  </div>
                </>
              ) : (
                <div className="my-auto text-center space-y-4 p-2">
                  <div className="text-5xl">🏆</div>
                  <h2 className="text-xl font-extrabold text-emerald-400">Hoàn Thành Buổi Tập 3D!</h2>
                  <p className="text-xs text-slate-300">Hôm nay cơ thể và các khớp của bạn cảm thấy thế nào?</p>
                  <div className="space-y-2 pt-2">
                    <button onClick={() => { setStats(p => ({ ...p, xp: p.xp + 50, streak: p.streak + 1 })); setPlayerOpen(false); }} className="w-full py-3 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl text-xs font-bold text-emerald-300">💪 Rất sảng khoái, êm khớp (+50 XP)</button>
                    <button onClick={() => setPlayerOpen(false)} className="w-full py-3 bg-slate-800 rounded-2xl text-xs font-bold text-slate-300">Đóng</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* THANH ĐIỀU HƯỚNG DƯỚI ĐÁY */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 safe-bottom z-30">
            <div className="max-w-md mx-auto grid grid-cols-2 p-1.5 gap-1">
              <button onClick={() => setActiveTab("workout")} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center ${activeTab === "workout" ? "bg-sky-600 text-white" : "text-slate-400"}`}>
                <span>🏋️ Lịch Tập 3D</span>
              </button>
              <button onClick={() => setActiveTab("diet")} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center ${activeTab === "diet" ? "bg-sky-600 text-white" : "text-slate-400"}`}>
                <span>🥗 Axit Uric & Nước</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
