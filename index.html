<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 1. ÂM THANH CÒI & GIỌNG ĐỌC HUẤN LUYỆN VIÊN TIẾNG VIỆT
    const playBeep = (freq = 880, duration = 180, type = "sine") => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch (e) {}
    };

    const speakVN = (text, enabled = true) => {
      if (!enabled || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "vi-VN";
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    };

    // 2. ĐỒ HỌA SINH ĐỘNG 3 BƯỚC STEP 1 - STEP 2 - STEP 3 (MỞ RỘNG WALL PILATES, CHAIR YOGA, STRETCH, OUTDOOR)
    const StepDiagram = ({ type, isLive, muscleHighlight }) => {
      const [liveStep, setLiveStep] = useState(0);

      useEffect(() => {
        if (!isLive) return;
        const interval = setInterval(() => {
          setLiveStep((prev) => (prev + 1) % 3);
        }, 800);
        return () => clearInterval(interval);
      }, [isLive]);

      const renderPose = (stepIndex) => {
        // A. WALL PILATES (Tập dựa tường êm khớp)
        if (type === "wall") {
          return (
            <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-purple-700/60 mb-1.5">
              {/* Mặt sàn & Bức tường bên phải */}
              <line x1="10" y1="84" x2="210" y2="84" stroke="#475569" strokeWidth="3" />
              <line x1="185" y1="10" x2="185" y2="84" stroke="#a855f7" strokeWidth="5" />
              <rect x="8" y="6" width="102" height="17" rx="4" fill="#a855f725" stroke="#a855f760" />
              <text x="59" y="17" fill="#e9d5ff" fontSize="9.5" fontWeight="bold" textAnchor="middle">
                🧱 Wall Pilates: {muscleHighlight || "Đùi & Bụng"}
              </text>
              <rect x="118" y="6" width="58" height="18" rx="4" fill="#000000bb" />
              <text x="147" y="18" fill="#fff" fontSize="10.5" fontWeight="bold" textAnchor="middle">
                STEP {stepIndex + 1}
              </text>

              {stepIndex === 0 && (
                <g>
                  {/* Nằm ngửa gác chân vuông góc lên tường hoặc dựa lưng tường */}
                  <line x1="85" y1="81" x2="140" y2="81" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <circle cx="72" cy="79" r="7" fill="#fcd34d" />
                  <polyline points="140,81 155,52 182,52" fill="none" stroke="#e2e8f0" strokeWidth="5.5" strokeLinecap="round" />
                  <line x1="150" y1="45" x2="180" y2="45" stroke="#ef4444" strokeWidth="2.5" strokeDasharray="3" />
                </g>
              )}
              {stepIndex === 1 && (
                <g>
                  {/* Mũi tên đỏ nâng hông rời sàn dựa lực vào tường */}
                  <line x1="130" y1="76" x2="130" y2="42" stroke="#ef4444" strokeWidth="3" />
                  <polygon points="130,42 125,50 135,50" fill="#ef4444" />
                  <circle cx="72" cy="79" r="7" fill="#fcd34d" />
                  <line x1="85" y1="80" x2="145" y2="54" stroke="#ef4444" strokeWidth="7" strokeLinecap="round" />
                  <polyline points="145,54 158,42 182,42" fill="none" stroke="#e2e8f0" strokeWidth="5.5" strokeLinecap="round" />
                </g>
              )}
              {stepIndex === 2 && (
                <g>
                  {/* Mũi tên xanh lá kiểm soát hạ từng đốt sống */}
                  <line x1="130" y1="44" x2="130" y2="76" stroke="#22c55e" strokeWidth="3" />
                  <polygon points="130,76 125,68 135,68" fill="#22c55e" />
                  <circle cx="72" cy="79" r="7" fill="#fcd34d" />
                  <line x1="85" y1="81" x2="140" y2="81" stroke="#22c55e" strokeWidth="7" strokeLinecap="round" />
                  <polyline points="140,81 155,52 182,52" fill="none" stroke="#e2e8f0" strokeWidth="5.5" strokeLinecap="round" />
                </g>
              )}
            </svg>
          );
        }

        // B. CHAIR YOGA / VĂN PHÒNG (Tập trên ghế)
        if (type === "chair") {
          return (
            <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-amber-600/60 mb-1.5">
              <line x1="10" y1="84" x2="220" y2="84" stroke="#475569" strokeWidth="3" />
              {/* Khung ghế văn phòng */}
              <polyline points="88,36 88,62 118,62 118,84" fill="none" stroke="#f59e0b" strokeWidth="3.5" />
              <line x1="88" y1="62" x2="88" y2="84" stroke="#f59e0b" strokeWidth="3.5" />

              <rect x="8" y="6" width="102" height="17" rx="4" fill="#f59e0b25" stroke="#f59e0b60" />

                  <circle cx="102" cy="22" r="7" fill="#fcd34d" />

              {stepIndex === 1 && (
                <g>

              </text>

              {stepIndex === 0 && (
                <g>

                  <circle cx="112" cy="20" r="7" fill="#fcd34d" />

                  <line x1="108" y1="54" x2="124" y2="82" stroke="#22c55e" strokeWidth="5.5" strokeLinecap="round" />
                  <line x1="108" y1="54" x2="92" y2="82" stroke="#e2e8f0" strokeWidth="5.5" strokeLinecap="round" />
                </g>
              )}
              {stepIndex === 1 && (
                <g>
                  <line x1="130" y1="42" x2="165" y2="42" stroke="#ef4444" strokeWidth="3" />
                  <polygon points="165,42 156,37 156,47" fill="#ef4444" />
                  <circle cx="118" cy="20" r="7" fill="#fcd34d" />

                  <polyline points="110,54 95,68 84,78" fill="none" stroke="#e2e8f0" strokeWidth="5.5" strokeLinecap="round" />
                </g>
              )}
              {stepIndex === 2 && (
                <g>
                  <line x1="138" y1="58" x2="138" y2="80" stroke="#22c55e" strokeWidth="3" />
                  <polygon points="138,80 133,72 143,72" fill="#22c55e" />
                  <circle cx="115" cy="20" r="7" fill="#fcd34d" />
                  <line x1="115" y1="28" x2="112" y2="54" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <line x1="112" y1="54" x2="128" y2="82" stroke="#22c55e" strokeWidth="6" strokeLinecap="round" />
                  <line x1="112" y1="54" x2="96" y2="82" stroke="#e2e8f0" strokeWidth="5" strokeLinecap="round" />
                </g>
              )}
            </svg>
          );
        }

        // D. CHỐNG ĐẨY / ĐẨY VAI CHỮ V (pike / pushup)
        if (type === "pike" || type === "pushup") {
          return (
            <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-slate-700/80 mb-1.5">
              <line x1="10" y1="84" x2="220" y2="84" stroke="#334155" strokeWidth="3" />
              <rect x="8" y="6" width="96" height="17" rx="4" fill="#ef444425" stroke="#ef444460" />
              <text x="56" y="17" fill="#fca5a5" fontSize="9.5" fontWeight="bold" textAnchor="middle">
                🔥 {muscleHighlight || "Vai & Ngực"}
              </text>
              <rect x="160" y="6" width="60" height="18" rx="4" fill="#000000bb" />
              <text x="190" y="18" fill="#fff" fontSize="11" fontWeight="bold" textAnchor="middle">
                STEP {stepIndex + 1}
              </text>

              {stepIndex === 0 && (
                <g>
                  <polyline points="35,45 95,12 165,42" fill="none" stroke="#ef4444" strokeWidth="3" />
                  <line x1="45" y1="82" x2="95" y2="24" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                  <line x1="95" y1="24" x2="145" y2="54" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <circle cx="138" cy="48" r="6" fill="#ef4444" opacity="0.85" />
                  <line x1="145" y1="54" x2="155" y2="82" stroke="#e2e8f0" strokeWidth="5" strokeLinecap="round" />
                  <circle cx="156" cy="54" r="7" fill="#fcd34d" />
                </g>
              )}
              {stepIndex === 1 && (
                <g>
                  <line x1="125" y1="15" x2="168" y2="42" stroke="#ef4444" strokeWidth="3" />
                  <polygon points="168,42 158,42 165,33" fill="#ef4444" />
                  <line x1="45" y1="82" x2="100" y2="34" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                  <line x1="100" y1="34" x2="158" y2="68" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <circle cx="146" cy="60" r="6.5" fill="#ef4444" />
                  <line x1="158" y1="68" x2="142" y2="74" stroke="#e2e8f0" strokeWidth="4.5" strokeLinecap="round" />
                  <line x1="142" y1="74" x2="155" y2="82" stroke="#e2e8f0" strokeWidth="4.5" strokeLinecap="round" />
                  <circle cx="168" cy="72" r="7" fill="#fcd34d" />
                </g>
              )}
              {stepIndex === 2 && (
                <g>
                  <line x1="132" y1="76" x2="118" y2="42" stroke="#22c55e" strokeWidth="3" />
                  <polygon points="118,42 114,51 125,48" fill="#22c55e" />
                  <line x1="45" y1="82" x2="95" y2="24" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                  <line x1="95" y1="24" x2="145" y2="54" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <circle cx="138" cy="48" r="6" fill="#22c55e" opacity="0.85" />
                  <line x1="145" y1="54" x2="155" y2="82" stroke="#e2e8f0" strokeWidth="5" strokeLinecap="round" />
                  <circle cx="156" cy="54" r="7" fill="#fcd34d" />
                </g>
              )}
            </svg>
          );
        }

        // E. SQUAT / THÂN DƯỚI
        if (type === "squat") {
          return (
            <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-slate-700/80 mb-1.5">
              <line x1="10" y1="84" x2="220" y2="84" stroke="#334155" strokeWidth="3" />
              <rect x="8" y="6" width="96" height="17" rx="4" fill="#ef444425" stroke="#ef444460" />
              <text x="56" y="17" fill="#fca5a5" fontSize="9.5" fontWeight="bold" textAnchor="middle">
                🔥 {muscleHighlight || "Đùi & Mông"}
              </text>
              <rect x="160" y="6" width="60" height="18" rx="4" fill="#000000bb" />
              <text x="190" y="18" fill="#fff" fontSize="11" fontWeight="bold" textAnchor="middle">
                STEP {stepIndex + 1}
              </text>

              {stepIndex === 0 && (
                <g>
                  <line x1="90" y1="15" x2="90" y2="82" stroke="#ef4444" strokeWidth="2.5" strokeDasharray="4" />
                  <circle cx="110" cy="18" r="7" fill="#fcd34d" />
                  <line x1="110" y1="26" x2="110" y2="52" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />
                  <line x1="110" y1="52" x2="110" y2="82" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                  <line x1="110" y1="32" x2="136" y2="32" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                </g>
              )}
              {stepIndex === 1 && (
                <g>
                  <line x1="68" y1="25" x2="68" y2="62" stroke="#ef4444" strokeWidth="3" />
                  <polygon points="68,62 63,53 73,53" fill="#ef4444" />
                  <circle cx="115" cy="30" r="7" fill="#fcd34d" />
                  <line x1="112" y1="38" x2="92" y2="58" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />

                  <line x1="68" y1="65" x2="68" y2="25" stroke="#22c55e" strokeWidth="3" />

                  <line x1="110" y1="26" x2="110" y2="52" stroke="#38bdf8" strokeWidth="7" strokeLinecap="round" />

        // Mặc định: PLANK / GIÃN CƠ / SOFA YOGA
        return (
          <svg viewBox="0 0 230 96" className="w-full h-24 bg-slate-900/95 rounded-xl border border-slate-700/80 mb-1.5">

            </text>
            <rect x="160" y="6" width="60" height="18" rx="4" fill="#000000bb" />
            <text x="190" y="18" fill="#fff" fontSize="11" fontWeight="bold" textAnchor="middle">
              STEP {stepIndex + 1}

            {stepIndex === 0 && (
              <g>
                <line x1="35" y1="45" x2="165" y2="45" stroke="#ef4444" strokeWidth="2.5" />
                <line x1="45" y1="82" x2="95" y2="55" stroke="#e2e8f0" strokeWidth="6" strokeLinecap="round" />
                <line x1="95" y1="55" x2="150" y2="55" stroke="#ef4444" strokeWidth="7" strokeLinecap="round" />
                <line x1="150" y1="55" x2="150" y2="82" stroke="#e2e8f0" strokeWidth="4" strokeLinecap="round" />
                <circle cx="162" cy="55" r="7" fill="#fcd34d" />

            {stepIndex === 1 && (
              <g>
                <line x1="115" y1="76" x2="115" y2="38" stroke="#ef4444" strokeWidth="3" />

              <g>

        } else if (environmentMode === "jog") {

        const merged = [
          ...(autoWarmupCooldown && environmentMode === "indoor" ? STANDARD_WARMUP : []),
          ...coreList,
          ...addedTodayExercises,
          ...(autoWarmupCooldown ? STANDARD_COOLDOWN : [])

      const currentMeal = MEAL_PLAN[selectedDayIdx];

      // Tính toán Calo & Protein nạp vào theo bữa đã đánh dấu
      const nutritionProgress = useMemo(() => {

        if (checkedMeals.l) { cal += 550; pro += 25; }
        if (checkedMeals.s) { cal += 200; pro += 12; }
        if (checkedMeals.d) { cal += 470; pro += 26; }

      const addExerciseToToday = (ex) => {

      const handleCreateCustomExercise = (e) => {

        const created = {

          baseSets: 3,

          type: newExForm.type,
          muscle: newExForm.muscle || "Toàn thân",

            `STEP 1: ${newExForm.step1 || "Chuẩn bị tư thế thẳng lưng, hít sâu."}`,
            `STEP 2: ${newExForm.step2 || "Thực hiện chuyển động chậm rãi có kiểm soát."}`,
            `STEP 3: ${newExForm.step3 || "Thở ra và trở về vị trí ban đầu."}`
          ]
        };
        setCustomLibrary((prev) => [created, ...prev]);
        setShowAddModal(false);
        setNewExForm({
          name: "",
          category: "wall_pilates",
          muscle: "Toàn thân & Cột sống",
          repsText: "12 lần",
          workSec: 45,
          type: "wall",
          step1: "",
          step2: "",
          step3: ""
        });
        speakVN("Đã lưu bài tập mới vào thư viện", voiceEnabled);
      };

      const toggleJointSafe = () => {
        const next = !jointSafeMode;
        setJointSafeMode(next);
        if (next) {
          const newMap = {};
          WORKOUT_PLAN.forEach((d) =>
            d.exercises.forEach((ex) => {
              if (ex.alt) newMap[ex.id] = true;

          setSwappedMap(newMap);
          speakVN("Đã bật chế độ êm khớp gối và lưng", voiceEnabled);
        } else {
          setSwappedMap({});

      };

      // Đồng hồ bấm giờ mini
      useEffect(() => {
        if (!timerRunning) return;
        if (timerSec <= 0) {
          setTimerRunning(false);
          playBeep(1046, 350);
          speakVN("Hết giờ nghỉ, tiếp tục hiệp tiếp theo", voiceEnabled);
          return;
        }
        if (timerSec === 3 || timerSec === 2 || timerSec === 1) playBeep(660, 100);
        const id = setInterval(() => setTimerSec((s) => s - 1), 1000);
        return () => clearInterval(id);
      }, [timerRunning, timerSec, voiceEnabled]);

      // Đồng hồ văn phòng 45 phút
      useEffect(() => {
        if (!officeRunning) return;
        if (officeSec <= 0) {
          setOfficeRunning(false);
          playBeep(880, 500);
          speakVN("Đã ngồi làm việc 45 phút. Hãy đứng dậy vươn vai và uống một cốc nước lọc nhé!", voiceEnabled);
          alert("🪑 Đã ngồi 45 phút! Hãy đứng dậy vươn vai 1 phút và uống nước đào thải axit uric nhé!");
          setOfficeSec(2700);
          return;
        }
        const id = setInterval(() => setOfficeSec((s) => s - 1), 1000);
        return () => clearInterval(id);
      }, [officeRunning, officeSec, voiceEnabled]);

      // Logic chạy Guided Workout Player
      const startGuidedSession = () => {
        const firstEx = currentWorkout.exercises[0];
        const useAlt = swappedMap[firstEx.id] && firstEx.alt;
        const activeName = useAlt ? firstEx.alt.name : firstEx.name;
        setPlayerExIdx(0);
        setPlayerPhase("work");
        setPlayerSec(firstEx.workSec || 45);
        setPlayerPaused(false);
        setPlayerOpen(true);
        playBeep(880, 250);
        speakVN(`Bắt đầu buổi tập chuẩn hóa. Phần một: ${activeName}`, voiceEnabled);
      };

      useEffect(() => {
        if (!playerOpen || playerPaused || playerPhase === "finish") return;

        if (playerSec <= 0) {
          const exercises = currentWorkout.exercises;
          const currEx = exercises[playerExIdx];

          if (playerPhase === "work") {
            setStats((prev) => ({
              ...prev,
              xp: prev.xp + 25,
              doneIds: prev.doneIds.includes(currEx.id) ? prev.doneIds : [...prev.doneIds, currEx.id]
            }));

            if (playerExIdx + 1 < exercises.length) {
              setPlayerPhase("rest");
              setPlayerSec(currEx.rest || 30);
              playBeep(660, 250);
              speakVN(`Tốt lắm! Nghỉ hít thở ${currEx.rest || 30} giây`, voiceEnabled);
            } else {
              setPlayerPhase("finish");
              playBeep(1046, 450);
              speakVN("Chúc mừng bạn đã hoàn thành trọn vẹn từ khởi động đến giãn cơ!", voiceEnabled);
            }
          } else if (playerPhase === "rest") {
            const nextIdx = playerExIdx + 1;
            const nextEx = exercises[nextIdx];
            const useAlt = swappedMap[nextEx.id] && nextEx.alt;
            const nextName = useAlt ? nextEx.alt.name : nextEx.name;
            setPlayerExIdx(nextIdx);
            setPlayerPhase("work");
            setPlayerSec(nextEx.workSec || 45);
            playBeep(880, 250);
            speakVN(`Tiếp theo: ${nextName}`, voiceEnabled);
          }
          return;
        }

        if (playerSec === 10 && playerPhase === "work") {
          speakVN("Còn 10 giây cố lên!", voiceEnabled);
        }
        if (playerSec <= 3 && playerSec >= 1) {
          playBeep(740, 90);
        }

        const timer = setInterval(() => setPlayerSec((s) => s - 1), 1000);
        return () => clearInterval(timer);
      }, [playerOpen, playerPaused, playerSec, playerPhase, playerExIdx, currentWorkout, swappedMap, voiceEnabled]);

      const filteredFoods = useMemo(() => {
        return PURINE_DB.filter((item) => {
          const matchLevel = foodFilter === "all" || item.level === foodFilter;
          const matchText = item.name.toLowerCase().includes(foodQuery.toLowerCase()) ||

        const s = totalSec % 60;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;

        const m = Math.floor((totalSec % 3600) / 60);

                {jointSafeMode ? "🛡️ Êm Khớp: BẬT" : "🛡️ Êm Khớp"}

                  <button

                    className={`py-1.5 rounded-lg text-center transition ${
                      active

                    <div className="text-[11px]">{d.day.replace("Thứ ", "T").replace("Chủ Nhật", "CN")}</div>

                      🌤️ Chọn không gian tập hôm nay:
                    </span>
                    <button
                      onClick={() => setActiveTab("library")}
                      className="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/40 px-2 py-0.5 rounded-full font-bold"
                    >
                      + Thêm bài từ Thư viện

                  <div className="grid grid-cols-3 gap-1.5">
                    <button
                      onClick={() => setEnvironmentMode("indoor")}
                      className={`py-2 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 border ${
                        environmentMode === "indoor"

                    >

                    <button
                      onClick={() => setEnvironmentMode("walk")}
                      className={`py-2 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 border ${

                    <button

                <div className="p-4 rounded-2xl border bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950/60 border-slate-700/80 shadow-lg">

                    <button
                      onClick={() => setPlayerSec((s) => s + 20)}
                      className="py-3 bg-slate-800 rounded-xl text-xs font-bold text-slate-200"
                    >
                      +20 Giây
                    </button>
                    <button
                      onClick={() => setPlayerPaused(!playerPaused)}
                      className="py-3 bg-sky-600 rounded-xl text-xs font-extrabold text-white"
                    >
                      {playerPaused ? "▶️ Tiếp tục" : "⏸️ Tạm dừng"}
                    </button>
                    <button
                      onClick={() => setPlayerSec(0)}
                      className="py-3 bg-emerald-600 rounded-xl text-xs font-extrabold text-white"
                    >
                      Qua bài ⏭️
                    </button>
                  </div>
                </>
              ) : (
                <div className="my-auto text-center space-y-4 p-2">
                  <div className="text-5xl">🏆</div>
                  <h2 className="text-xl font-extrabold text-emerald-400">
                    Hoàn Thành Chuỗi Tập Chuẩn Hóa!
                  </h2>
                  <p className="text-xs text-slate-300">
                    AI Coach hỏi: Hôm nay cơ thể và các khớp của bạn cảm thấy thế nào?
                  </p>
                  <div className="space-y-2.5 pt-2">
                    <button
                      onClick={() =>
                        handleCoachFeedback(1, "Tuyệt vời! Đã cộng 50 XP và tăng chuỗi Streak của bạn.")
                      }
                      className="w-full py-3 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl text-xs font-bold text-emerald-300"
                    >
                      💪 Rất sảng khoái, còn dư sức (+50 XP)
                    </button>
                    <button
                      onClick={() =>
                        handleCoachFeedback(0, "Rất chuẩn! Hãy uống ngay 1 cốc nước lọc nhé.")
                      }
                      className="w-full py-3 bg-sky-600/20 border border-sky-500/40 rounded-2xl text-xs font-bold text-sky-300"
                    >
                      👌 Vừa sức, êm khớp (+50 XP)
                    </button>
                    <button
                      onClick={() =>
                        handleCoachFeedback(-1, "Đã ghi nhận! Buổi sau AI sẽ giảm bớt hiệp để cơ thể phục hồi.")
                      }
                      className="w-full py-3 bg-amber-600/20 border border-amber-500/40 rounded-2xl text-xs font-bold text-amber-300"
                    >
                      😓 Hơi căng / Mỏi khớp (Buổi sau giảm nhẹ)
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* THANH ĐIỀU HƯỚNG DƯỚI ĐÁY (4 TAB) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 safe-bottom z-30">
            <div className="max-w-md mx-auto grid grid-cols-4 p-1.5 gap-1">
              <button
                onClick={() => setActiveTab("workout")}
                className={`py-2 rounded-xl text-[11px] font-bold flex flex-col items-center ${
                  activeTab === "workout" ? "bg-sky-600 text-white" : "text-slate-400"
                }`}
              >
                <span>🏋️ Lịch Tập</span>
              </button>
              <button
                onClick={() => setActiveTab("library")}
                className={`py-2 rounded-xl text-[11px] font-bold flex flex-col items-center ${
                  activeTab === "library" ? "bg-purple-600 text-white" : "text-slate-400"
                }`}
              >
                <span>📚 Thư Viện</span>
              </button>
              <button
                onClick={() => setActiveTab("diet")}
                className={`py-2 rounded-xl text-[11px] font-bold flex flex-col items-center ${
                  activeTab === "diet" ? "bg-sky-600 text-white" : "text-slate-400"
                }`}
              >
                <span>🥗 Dinh Dưỡng</span>
              </button>
              <button
                onClick={() => setActiveTab("office")}
                className={`py-2 rounded-xl text-[11px] font-bold flex flex-col items-center ${
                  activeTab === "office" ? "bg-sky-600 text-white" : "text-slate-400"
                }`}
              >
                <span>🪑 Văn Phòng</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
